# ══════════════════════════════════════════════════════════════════════════════
# HostCheck — Nginx reverse proxy (subdomain + HTTPS + iki katmanlı erişim)
#
# panel.ornek.com  → HostCheck
#   • Genel araçlar (DNS, SSL, Blacklist, Mail, IP): HERKESE AÇIK
#   • Hazır Yanıtlar: OKUMA açık, YAZMA Basic Auth (limit_except)
#   • SSH / RDP / FTP / admin probe: Nginx Basic Auth — WebSocket dahil
#
# KURULUM:
#   1) "panel.ornek.com" yazan yerleri kendi subdomain'inizle değiştirin
#   2) Yönetici parolası:  sudo htpasswd -c /etc/nginx/hostcheck.htpasswd admin
#   3) SSL sertifikaları certbot ile (aşağıya bakın) otomatik doldurulur
#   4) sudo ln -s /etc/nginx/sites-available/hostcheck /etc/nginx/sites-enabled/
#   5) sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS yönlendirme ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name panel.ornek.com;

    # Let's Encrypt doğrulaması bu yoldan geçer, HTTPS'e yönlendirmeyin
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ana sunucu ──────────────────────────────────────────────────────────
server {
    # HTTP/2: eski ve yeni Nginx sürümleriyle uyumlu yazım (listen satırında).
    # Modern Nginx'te ayrı "http2 on;" da çalışır ama 1.25.1 öncesi tanımaz.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.ornek.com;

    # certbot bu iki satırı otomatik doldurur / yönetir:
    ssl_certificate     /etc/letsencrypt/live/panel.ornek.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.ornek.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Yükleme sınırı — FTP 512 MB yüklemeyi karşılasın (backend limiti ayrı)
    client_max_body_size 550M;

    # WebSocket + uzun aktarımlar için zaman aşımlarını uzat (SSH/RDP/FTP)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # ── Basic Auth realm — TÜM korumalı bloklar AYNI realm string'ini
    #    kullanmalı; yoksa tarayıcı SSH için ayrı, RDP için ayrı kimlik ister
    #    ve WebSocket'e cache'li kimlik taşınmaz.
    set $auth_realm "HostCheck Yonetici Erisimi";

    # ── Frontend (statik build) ───────────────────────────────────────────────
    root /var/www/hostcheck;          # frontend/dist buraya kopyalanır
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA — tüm yollar index.html'e
    }

    # ── KORUMALI: yönetici probe'u + SSH/RDP/FTP (WebSocket dahil) ────────────
    # ÖNEMLİ: Bu bloklar diğer /api bloğundan ÖNCE gelmeli (Nginx en uzun
    # eşleşmeyi seçer; prefix'ler ayrık olduğu için sıra kritik değil ama
    # okunabilirlik için önde).
    location /api/admin/ {
        auth_basic           $auth_realm;
        auth_basic_user_file /etc/nginx/hostcheck.htpasswd;
        proxy_pass           http://127.0.0.1:8000;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    location /api/ssh/ {
        auth_basic           $auth_realm;
        auth_basic_user_file /etc/nginx/hostcheck.htpasswd;
        proxy_pass           http://127.0.0.1:8000;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;      # WebSocket
        proxy_set_header     Connection "upgrade";
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    location /api/rdp/ {
        auth_basic           $auth_realm;
        auth_basic_user_file /etc/nginx/hostcheck.htpasswd;
        proxy_pass           http://127.0.0.1:8000;
        proxy_http_version   1.1;
        proxy_set_header     Upgrade $http_upgrade;      # WebSocket
        proxy_set_header     Connection "upgrade";
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    location /api/ftp/ {
        auth_basic           $auth_realm;
        auth_basic_user_file /etc/nginx/hostcheck.htpasswd;
        proxy_pass           http://127.0.0.1:8000;
        proxy_http_version   1.1;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_request_buffering off;                    # büyük yüklemeler akışsız
    }

    # ── KISMEN KORUMALI: hazır yanıt kütüphanesi ──────────────────────────────
    # Okuma herkese açık (teknisyen panelde arama yapar), fakat YAZMA uçları
    # kimlik ister. Bu blok TEK kapıdır: uygulama tarafında hazır yanıt yazma
    # uçlarının hiçbir yetkilendirmesi yok (üyelik 3 Eylül'de geri alındı).
    # Kaldırılırsa internetteki herkes 89 kayıtlık kütüphaneyi silebilir ya da
    # içeriğini değiştirebilir — hazır yanıtlar müşterilere kopyalanıp
    # gönderildiği için bu, teknisyen aracılığıyla kimlik avı bağlantısı
    # dağıtmanın yolu olurdu.
    #
    # Trailing slash YOK: bu prefix hem "/api/hazir-yanitlar" (liste/oluştur)
    # hem "/api/hazir-yanitlar/..." yollarını yakalar.
    location /api/hazir-yanitlar {
        limit_except GET HEAD {
            auth_basic           $auth_realm;
            auth_basic_user_file /etc/nginx/hostcheck.htpasswd;
        }
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── AÇIK: diğer tüm API'ler (DNS, SSL, blacklist, mail, IP) ───────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
